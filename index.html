<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Filter Room">
<title>Filter Room</title>
<style>
:root{--bg:#0e0c10;--panel:#1c191f;--line:#2e2a33;--fg:#f2eef4;--muted:#9b93a3;--accent:#e8a6b8;--accent-ink:#2a1219;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#000;color:var(--fg);font:14px -apple-system,"Apple SD Gothic Neo",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
/* 카메라 화면은 전체 화면, 조작부(#ui)는 그 위 아래쪽에 겹침 */
/* iOS Safari는 WebGL 캔버스 레이어를 뒤 요소보다 위에 합성할 수 있어 쌓임 순서를 명시 */
#stage{position:fixed;inset:0;background:#000;touch-action:none;z-index:0}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;z-index:10;transform:translateZ(0)}
#modes,#bar{background:rgba(0,0,0,.45)}
#gl{width:100%;height:100%;object-fit:contain;display:block}
#msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:14px;line-height:1.6;background:rgba(0,0,0,.55)}
#msg button{margin-top:12px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
/* 필터·조절 패널: 미리보기 위에 겹쳐 뜨고, 버튼을 누를 때만 보임 */
/* 둘 다 열면 조절(위)과 필터(아래)가 겹치지 않고 쌓임 */
#panels{display:flex;flex-direction:column}
.panel{background:rgba(14,12,16,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#strip{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 12px;scrollbar-width:none}
#scenes{display:flex;gap:6px;padding:10px 16px 0}
#scenes button{flex:1;height:32px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font:600 13px inherit;cursor:pointer}
#scenes button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#curname{position:absolute;left:12px;top:calc(10px + env(safe-area-inset-top,0px));font:600 12px inherit;background:rgba(0,0,0,.5);color:var(--fg);padding:4px 10px;border-radius:999px;pointer-events:none}
.grp{display:flex;gap:8px;justify-self:start}.grp.end{justify-self:end}
.side[aria-expanded="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#strip::-webkit-scrollbar{display:none}
.fx{flex:0 0 auto;width:60px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:var(--muted);font:500 11px inherit;padding:0;cursor:pointer}
.fx canvas{width:56px;height:56px;object-fit:cover;border-radius:10px;border:2px solid transparent;background:var(--panel);transform:scaleY(-1);display:block}
.fx span{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx[aria-pressed="true"]{color:var(--fg)}
.fx[aria-pressed="true"] canvas{border-color:var(--accent)}
#grid{position:absolute;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);pointer-events:none}
#grid i{border-right:1px solid rgba(255,255,255,.45);border-bottom:1px solid rgba(255,255,255,.45)}
#grid i:nth-child(3n){border-right:0}#grid i:nth-child(n+7){border-bottom:0}
#t-grid{position:absolute;right:12px;top:calc(8px + env(safe-area-inset-top,0px));font:600 12px inherit;background:rgba(0,0,0,.5);color:var(--fg);border:0;padding:6px 12px;border-radius:999px;cursor:pointer}
#t-grid[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
#controls{display:grid;gap:2px;padding:10px 16px}
.resetrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--muted);padding-top:4px}
#reset{background:none;border:1px solid var(--line);color:var(--fg);font:500 12px inherit;padding:5px 10px;border-radius:999px;cursor:pointer}
.row{display:grid;grid-template-columns:62px 1fr 30px;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.row output{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--accent);height:26px;margin:0}
#bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:4px 16px calc(6px + env(safe-area-inset-bottom,0px))}
.side{height:40px;min-width:50px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 13px inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0 12px}
#lib-btn{justify-self:start}#flip{justify-self:end}
#shutter{width:60px;height:60px;border-radius:50%;border:4px solid var(--fg);background:var(--accent);cursor:pointer}
#shutter:active{transform:scale(.94)}
#shutter.video{background:#e5484d}
#shutter.rec{border-radius:16px;transform:scale(.8)}
#modes{display:flex;justify-content:center;gap:4px;padding-top:4px}
#modes button{background:none;border:0;color:var(--muted);font:600 12px inherit;padding:3px 10px;border-radius:999px;cursor:pointer}
#modes button[aria-pressed="true"]{color:var(--fg);background:var(--panel)}
#rectime{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#e5484d;color:#fff;font:600 13px inherit;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:999px}
.sep{flex:0 0 auto;align-self:center;font-size:11px;letter-spacing:.06em;color:var(--muted);padding:0 4px 0 8px;border-left:1px solid var(--line)}
#review video{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:10px;background:#000}
button:focus-visible,label:focus-within{outline:2px solid var(--fg);outline-offset:2px}
#lib{display:none}
#review{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#review img{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:10px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#review p{margin:0;text-align:center;color:var(--muted);font-size:12px}
#review .acts{display:flex;gap:10px}
#review .acts button{flex:1;height:48px;border-radius:12px;font:600 15px inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
#review .acts .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" aria-label="카메라 미리보기"></canvas>
  <div id="flash"></div>
  <div id="msg" hidden></div>
  <div id="rectime" hidden></div>
  <div id="grid" hidden><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div id="curname"></div>
  <button id="t-grid" type="button" aria-pressed="false">격자</button>
</div>
<!-- 아래쪽 조작부: 카메라 화면 위에 겹쳐 떠 있음 (패널 → 촬영 모드 → 버튼 줄 순으로 쌓임) -->
<div id="ui">
  <div id="panels">
  <div class="panel" id="controls" hidden>
  <label class="row"><span>필터 강도</span><input id="k" type="range" min="0" max="100" value="80"><output id="kv"></output></label>
  <label class="row"><span>주름 완화</span><input id="wr" type="range" min="0" max="100" value="70"><output id="wrv"></output></label>
  <label class="row"><span>피부 보정</span><input id="sm" type="range" min="0" max="100" value="50"><output id="smv"></output></label>
  <label class="row"><span>선명도</span><input id="sh" type="range" min="0" max="100" value="40"><output id="shv"></output></label>
  <label class="row"><span>밝기</span><input id="br" type="range" min="-50" max="50" value="0"><output id="brv"></output></label>
  <div class="resetrow"><span><span id="scenehint">이 필터의 값은 따로 기억됩니다</span><br><span id="res"></span></span><button id="reset" type="button">기본값으로</button></div>
  </div>
  <div class="panel" id="filterpanel" hidden>
    <div id="scenes" role="group" aria-label="촬영 대상"></div>
    <div id="strip" role="group" aria-label="필터"></div>
  </div>
  </div>
<div id="modes" role="group" aria-label="촬영 모드"><button type="button" data-m="photo" aria-pressed="true">사진</button><button type="button" data-m="video" aria-pressed="false">동영상</button></div>
<div id="bar">
  <div class="grp"><label class="side" id="lib-btn" for="lib">앨범<input id="lib" type="file" accept="image/*"></label><button class="side" id="t-strip" type="button" aria-expanded="false">필터</button></div>
  <button id="shutter" type="button" aria-label="촬영"></button>
  <div class="grp end"><button class="side" id="t-controls" type="button" aria-expanded="false">조절</button><button class="side" id="flip" type="button">전환</button></div>
</div>
</div>
<div id="review" hidden>
  <img id="shot" alt="촬영한 사진">
  <video id="clip" playsinline controls loop hidden></video>
  <p>공유 시트에서 "이미지 저장" 또는 "비디오 저장"을 누르세요</p>
  <div class="acts"><button id="retake" type="button">다시 찍기</button><button id="save" class="primary" type="button">사진 저장</button></div>
</div>

<script>
// 아이폰에서 원인을 알 수 있도록 스크립트 오류를 화면에 표시
window.addEventListener("error",e=>{const m=document.getElementById("msg");if(m){m.textContent="오류: "+e.message+" ("+(e.lineno||"?")+"행)";m.hidden=false;}});
// ── 필터 정의 (값은 0~255 기준 색 더하기, 나머지는 비율) ──
// exp 노출, con 대비, sat 채도, temp 색온도(+따뜻), tint(+마젠타), fade 검정 들뜸, roll 하이라이트 눌림
// sh/hi 어두운·밝은 영역에 더할 색, vig 비네팅, grain 입자, mono 흑백
const FILTERS=[
  {id:"none",name:"원본",p:{}},
  {id:"milk",name:"뽀얀",p:{exp:.14,con:-.12,sat:-.08,temp:.02,tint:.25,fade:.05,hi:[6,2,5]}},
  {id:"peach",name:"피치",p:{exp:.08,con:-.06,sat:.04,temp:.22,tint:.35,sh:[8,0,2],hi:[8,3,0]}},
  {id:"clear",name:"클리어",p:{exp:.10,con:.12,sat:.14,temp:-.04}},
  {id:"cream",name:"크림",p:{exp:.06,con:-.08,sat:-.16,temp:.18,fade:.07,hi:[8,6,0]}},
  {id:"blueberry",name:"Blueberry",p:{exp:.10,con:-.06,sat:-.10,temp:-.30,tint:.30,fade:.07,sh:[-2,0,16],hi:[6,2,10]}},
  {id:"matt",name:"Matt",p:{exp:.03,con:-.18,sat:-.22,temp:.05,fade:.15,roll:.06,sh:[4,4,8]}},
  {id:"film",name:"필름",p:{con:.05,sat:-.10,temp:.14,fade:.10,sh:[0,6,10],hi:[10,6,0],vig:.28,grain:.05}},
  {id:"cool",name:"쿨",p:{exp:.05,sat:-.04,temp:-.24}},
  {id:"golden",name:"골든",p:{exp:.03,sat:.10,temp:.34,hi:[12,6,-6]}},
  {id:"mono",name:"흑백",p:{mono:1,con:.10,fade:.04}},
  // 음식·사물 전용: 따뜻하고 진한 음식 톤 / 흰색이 하얗게 남는 깔끔한 제품 톤
  {id:"food",name:"푸드",p:{exp:.06,con:.10,sat:.22,temp:.16,hi:[8,4,-2]}},
  {id:"product",name:"제품",p:{exp:.08,con:.10,sat:.04,temp:-.08}},
];
// ── 촬영 대상(장면): 고르면 조절 기본값이 바뀌고, 어울리는 필터를 앞에 추천 ──
// 인물 외에는 주름·피부 보정을 끔 (음식·나무·베이지 제품이 피부색으로 오인돼 뭉개지는 것 방지)
const SCENES={
  person:{label:"인물",def:{k:80,wr:70,sm:50,sh:40,br:0},rec:["milk","peach","clear","cream","blueberry","matt","film","cool","golden","mono","g-Aden","g-Stinson","g-Slumber","g-Mayfair","g-1977"]},
  food:{label:"음식",def:{k:80,wr:0,sm:0,sh:70,br:0},rec:["food","golden","g-Clarendon","g-Valencia","g-Rise","g-Lo-Fi","g-Reyes","g-Gingham","cream"]},
  object:{label:"사물",def:{k:80,wr:0,sm:0,sh:70,br:0},rec:["product","clear","cool","g-Lark","g-Clarendon","g-Gingham","g-Inkwell","g-Moon","mono"]},
  scenery:{label:"배경",def:{k:85,wr:0,sm:0,sh:60,br:0},rec:["clear","g-Clarendon","g-Lark","g-Perpetua","g-Hudson","g-Nashville","g-X-Pro II","g-Walden","golden","film","cool"]},
};

// ── CSSgram 필터 26종 ──
// 원본: https://github.com/una/CSSgram — The MIT License (MIT), Copyright (c) 2015 Una Kravets
// CSS의 filter 체인과 ::before/::after 색 레이어(mix-blend-mode)를 셰이더용 수치로 옮긴 것
// f: [연산, 값] 순서대로 — c 대비, b 밝기, s 채도, p 세피아, g 흑백, h 색상회전(도)
// L: [첫 레이어(::before), 둘째 레이어(::after)] — m 블렌드, t 종류, s 정지점 [r,g,b,a,위치], o 불투명도, at 원형 중심
const BM={multiply:1,screen:2,overlay:3,darken:4,lighten:5,"color-dodge":6,"color-burn":7,"soft-light":8,exclusion:9,hue:10,color:11};
const solid=(m,r,g,b,a=1,o=1)=>({m,t:1,s:[[r,g,b,a,0]],o});
const radial=(m,s,o=1,at=[.5,.5])=>({m,t:4,s,o,at});
const GRAM=[
  ["1977",[["c",1.1],["b",1.1],["s",1.3]],[solid("screen",243,106,188,.3)]],
  ["Aden",[["h",-20],["c",.9],["s",.85],["b",1.2]],[{m:"darken",t:2,s:[[66,10,14,.2,0],[0,0,0,0,1]],o:1}]],
  ["Brannan",[["p",.5],["c",1.4]],[solid("lighten",161,44,199,.31)]],
  ["Brooklyn",[["c",.9],["b",1.1]],[radial("overlay",[[168,223,193,.4,.7],[196,183,200,1,1]])]],
  ["Clarendon",[["c",1.2],["s",1.35]],[solid("overlay",127,187,227,.2)]],
  ["Earlybird",[["c",.9],["p",.2]],[radial("overlay",[[208,186,142,1,.2],[54,3,9,1,.85],[29,2,16,1,1]])]],
  ["Gingham",[["b",1.05],["h",-10]],[solid("soft-light",230,230,250)]],
  ["Hudson",[["b",1.2],["c",.9],["s",1.1]],[radial("multiply",[[166,177,255,1,.5],[52,33,52,1,1]],.5)]],
  ["Inkwell",[["p",.3],["c",1.1],["b",1.1],["g",1]],[]],
  ["Kelvin",[],[solid("color-dodge",56,44,52),solid("overlay",183,125,33)]],
  ["Lark",[["c",.9]],[solid("color-dodge",34,37,63),solid("darken",242,242,242,.8)]],
  ["Lo-Fi",[["s",1.1],["c",1.5]],[radial("multiply",[[0,0,0,0,.7],[34,34,34,1,1.5]])]],
  ["Maven",[["p",.25],["b",.95],["c",.95],["s",1.5]],[solid("hue",3,230,26,.2)]],
  ["Mayfair",[["c",1.1],["s",1.1]],[radial("overlay",[[255,255,255,.8,0],[255,200,200,.6,.3],[17,17,17,1,.6]],.4,[.4,.4])]],
  ["Moon",[["g",1],["c",1.1],["b",1.1]],[solid("soft-light",160,160,160),solid("lighten",56,56,56)]],
  ["Nashville",[["p",.2],["c",1.2],["b",1.05],["s",1.2]],[solid("darken",247,176,153,.56),solid("lighten",0,70,150,.4)]],
  ["Perpetua",[],[{m:"soft-light",t:3,s:[[0,91,154,1,0],[230,193,61,1,1]],o:.5}]],
  ["Reyes",[["p",.22],["b",1.1],["c",.85],["s",.75]],[solid("soft-light",239,205,173,1,.5)]],
  ["Rise",[["b",1.05],["p",.2],["c",.9],["s",.9]],[radial("multiply",[[236,205,169,.15,.55],[50,30,7,.4,1]]),radial("overlay",[[232,197,152,.8,0],[0,0,0,0,.9]],.6)]],
  ["Slumber",[["s",.66],["b",1.05]],[solid("lighten",69,41,12,.4),solid("soft-light",125,105,24,.5)]],
  ["Stinson",[["c",.75],["s",.85],["b",1.15]],[solid("soft-light",240,149,128,.2)]],
  ["Toaster",[["c",1.5],["b",.9]],[radial("screen",[[128,78,15,1,0],[59,0,59,1,1]])]],
  ["Valencia",[["c",1.08],["b",1.08],["p",.08]],[solid("exclusion",58,3,57,1,.5)]],
  ["Walden",[["b",1.1],["h",-10],["p",.3],["s",1.6]],[solid("screen",0,68,204,1,.3)]],
  ["Willow",[["g",.5],["c",.95],["b",.9]],[null,solid("color",216,205,203)]],
  ["X-Pro II",[["p",.3]],[radial("color-burn",[[230,231,224,1,.4],[43,42,161,.6,1.1]])]],
];
for(const [name,f,L] of GRAM) FILTERS.push({id:"g-"+name,name,g:{f,L},gram:true});

// CSS 필터 함수 → 3×3 행렬(행 우선)과 오프셋 (Filter Effects 명세의 계수)
function cssMatrix([op,a]){
  const I=[1,0,0,0,1,0,0,0,1];
  if(op==="b") return [[a,0,0,0,a,0,0,0,a],[0,0,0]];
  if(op==="c") {const o=.5-.5*a;return [[a,0,0,0,a,0,0,0,a],[o,o,o]];}
  if(op==="s") return [[.213+.787*a,.715-.715*a,.072-.072*a,.213-.213*a,.715+.285*a,.072-.072*a,.213-.213*a,.715-.715*a,.072+.928*a],[0,0,0]];
  if(op==="g"){const k=1-a;return [[.2126+.7874*k,.7152-.7152*k,.0722-.0722*k,.2126-.2126*k,.7152+.2848*k,.0722-.0722*k,.2126-.2126*k,.7152-.7152*k,.0722+.9278*k],[0,0,0]];}
  if(op==="p"){const k=1-a;return [[.393+.607*k,.769-.769*k,.189-.189*k,.349-.349*k,.686+.314*k,.168-.168*k,.272-.272*k,.534-.534*k,.131+.869*k],[0,0,0]];}
  if(op==="h"){const r=a*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
    return [[.213+c*.787-s*.213,.715-c*.715-s*.715,.072-c*.072+s*.928,.213-c*.213+s*.143,.715+c*.285+s*.140,.072-c*.072-s*.283,.213-c*.213-s*.787,.715-c*.715+s*.715,.072+c*.928+s*.072],[0,0,0]];}
  return [I,[0,0,0]];
}
// CSSgram 필터의 셰이더 값 미리 계산
for(const F of FILTERS) if(F.g){
  const ms=[],bs=[];
  for(let i=0;i<5;i++){
    const [m,b]=cssMatrix(F.g.f[i]||["i",0]);
    ms.push(m[0],m[3],m[6],m[1],m[4],m[7],m[2],m[5],m[8]); // 열 우선으로 변환
    bs.push(...b);
  }
  F.g.mat=new Float32Array(ms); F.g.off=new Float32Array(bs);
  F.g.layers=[0,1].map(i=>{
    const l=F.g.L[i]; if(!l) return null;
    const st=l.s.map(([r,g,b,a,pos])=>({c:[r/255,g/255,b/255,a],pos}));
    return {m:BM[l.m],t:l.t,o:l.o,n:st.length,cen:l.at?[l.at[0],1-l.at[1]]:[.5,.5],
      c:[0,1,2].map(j=>(st[j]||st[st.length-1]).c),p:[0,1,2].map(j=>(st[j]||st[st.length-1]).pos)};
  });
}

const $=id=>document.getElementById(id);
const canvas=$("gl");
const gl=canvas.getContext("webgl",{preserveDrawingBuffer:true,premultipliedAlpha:false});

// ── 셰이더 ──
const VS=`attribute vec2 a;varying vec2 v;void main(){v=a*.5+.5;gl_Position=vec4(a,0.,1.);}`;
// 9탭 가우시안 블러 (dir = 텍셀 간격 × 방향)
const BLUR=`precision highp float;varying vec2 v;uniform sampler2D T;uniform vec2 dir;
void main(){vec3 s=texture2D(T,v).rgb*.227027;
s+=(texture2D(T,v+dir).rgb+texture2D(T,v-dir).rgb)*.1945946;
s+=(texture2D(T,v+dir*2.).rgb+texture2D(T,v-dir*2.).rgb)*.1216216;
s+=(texture2D(T,v+dir*3.).rgb+texture2D(T,v-dir*3.).rgb)*.054054;
s+=(texture2D(T,v+dir*4.).rgb+texture2D(T,v-dir*4.).rgb)*.016216;
gl_FragColor=vec4(s,1.);}`;
const COPY=`precision highp float;varying vec2 v;uniform sampler2D T;void main(){gl_FragColor=texture2D(T,v);}`;
// 최종: 피부 보정(작은 블러) → 주름 완화(큰 블러 평균보다 어두운 피부만 채움) → 색감 필터 → 강도·밝기
const FINAL=`precision highp float;varying vec2 v;
uniform sampler2D S,B,L;uniform float uMirror,uOrig,uSm,uWr,uK,uBr,uExp,uCon,uSat,uTemp,uTint,uFade,uRoll,uVig,uGrain,uMono,uSeed;
uniform vec3 uSh,uHi;uniform vec2 uRes,uTx;uniform float uSharp;
const vec3 LU=vec3(.299,.587,.114);
float sat01(float x){return clamp(x,0.,1.);}
// ── CSS 블렌드 모드 (W3C Compositing 명세) ──
uniform float uG,uM0,uT0,uN0,uOp0,uFar0,uM1,uT1,uN1,uOp1,uFar1;
uniform vec2 uCen0,uCen1;uniform vec3 uP0,uP1;uniform vec4 uC00,uC01,uC02,uC10,uC11,uC12;
uniform mat3 uFM[5];uniform vec3 uFB[5];
float lum(vec3 c){return dot(c,vec3(.3,.59,.11));}
vec3 clipC(vec3 c){float l=lum(c),n=min(min(c.r,c.g),c.b),x=max(max(c.r,c.g),c.b);
 if(n<0.)c=l+(c-l)*l/(l-n); if(x>1.)c=l+(c-l)*(1.-l)/(x-l); return c;}
vec3 setLum(vec3 c,float l){return clipC(c+(l-lum(c)));}
float satC(vec3 c){return max(max(c.r,c.g),c.b)-min(min(c.r,c.g),c.b);}
vec3 setSat(vec3 c,float s){float n=min(min(c.r,c.g),c.b),x=max(max(c.r,c.g),c.b);return x>n?(c-n)*s/(x-n):vec3(0.);}
float dodge(float b,float s){return b==0.?0.:s>=1.?1.:min(1.,b/(1.-s));}
float burn(float b,float s){return b>=1.?1.:s<=0.?0.:1.-min(1.,(1.-b)/s);}
float softL(float b,float s){float d=b<=.25?((16.*b-12.)*b+4.)*b:sqrt(b);return s<=.5?b-(1.-2.*s)*b*(1.-b):b+(2.*s-1.)*(d-b);}
vec3 blendM(float m,vec3 b,vec3 s){
 if(m<1.5) return b*s;
 if(m<2.5) return b+s-b*s;
 if(m<3.5) return mix(2.*b*s,1.-2.*(1.-b)*(1.-s),step(.5,b));
 if(m<4.5) return min(b,s);
 if(m<5.5) return max(b,s);
 if(m<6.5) return vec3(dodge(b.r,s.r),dodge(b.g,s.g),dodge(b.b,s.b));
 if(m<7.5) return vec3(burn(b.r,s.r),burn(b.g,s.g),burn(b.b,s.b));
 if(m<8.5) return vec3(softL(b.r,s.r),softL(b.g,s.g),softL(b.b,s.b));
 if(m<9.5) return b+s-2.*b*s;
 if(m<10.5) return setLum(setSat(s,satC(b)),lum(b));
 return setLum(s,lum(b));
}
// 그라데이션 (프리멀티플라이드 보간, 정지점 최대 3개)
vec4 grad(float t,float n,vec3 p,vec4 a,vec4 b,vec4 c){
 a.rgb*=a.a;b.rgb*=b.a;c.rgb*=c.a;
 vec4 r=t<=p.x?a:(n<2.5||t<=p.y)?mix(a,b,sat01((t-p.x)/max(p.y-p.x,1e-4))):mix(b,c,sat01((t-p.y)/max(p.z-p.y,1e-4)));
 return vec4(r.rgb/max(r.a,1e-4),r.a);
}
vec3 layer(float m,float ty,float n,float op,float far,vec2 cen,vec3 p,vec4 c0,vec4 c1,vec4 c2,vec3 base){
 if(ty<.5) return base;
 vec4 col=c0;
 if(ty>1.5){float t=ty<2.5?v.x:ty<3.5?1.-v.y:length((v-cen)*uRes)/far;col=grad(t,n,p,c0,c1,c2);}
 return mix(base,blendM(m,base,col.rgb),col.a*op);
}
void main(){
 vec2 uv=vec2(uMirror>.5?1.-v.x:v.x,v.y);
 vec3 c=texture2D(S,uv).rgb;
 if(uOrig>.5){gl_FragColor=vec4(c,1.);return;}
 float Y=dot(c,LU),Cb=.5-.1687*c.r-.3313*c.g+.5*c.b,Cr=.5+.5*c.r-.4187*c.g-.0813*c.b,k8=8./255.;
 float skin=sat01((Cr-133./255.)/k8)*sat01((173./255.-Cr)/k8)*sat01((Cb-77./255.)/k8)*sat01((127./255.-Cb)/k8)*sat01((Y-40./255.)/(20./255.));
 vec3 o=c;
 if(skin>0.){
  vec3 b=texture2D(B,uv).rgb,l=texture2D(L,uv).rgb;
  float edge=sat01(1.-abs(Y-dot(b,LU))/((14.+22.*uSm)/255.));
  o+=(b-c)*uSm*skin*edge*.92+uSm*skin*7./255.;
  float dk=dot(l,LU)-Y;
  if(dk>0.){o+=(l-c)*uWr*skin*sat01(dk/(28./255.))*sat01((75./255.-dk)/(25./255.));}
 }
 // 선명도: 라플라시안 샤프닝. 피부는 25%만 적용해 눈·머리카락·윤곽만 또렷하게
 if(uSharp>0.){
  vec2 t=uTx*1.5;
  vec3 n=texture2D(S,uv+vec2(t.x,0.)).rgb+texture2D(S,uv-vec2(t.x,0.)).rgb+texture2D(S,uv+vec2(0.,t.y)).rgb+texture2D(S,uv-vec2(0.,t.y)).rgb;
  o+=(c*4.-n)*uSharp*(1.-.75*skin);
 }
 vec3 x;
 if(uG>.5){
  // CSSgram 방식: 색 레이어 2장을 블렌드한 뒤 CSS 필터 체인(최대 5단계)을 순서대로 적용
  x=layer(uM0,uT0,uN0,uOp0,uFar0,uCen0,uP0,uC00,uC01,uC02,o);
  x=layer(uM1,uT1,uN1,uOp1,uFar1,uCen1,uP1,uC10,uC11,uC12,x);
  for(int i=0;i<5;i++) x=clamp(uFM[i]*x+uFB[i],0.,1.);
 }else{
 x=o*vec3(1.+uTemp*.12+uTint*.03,1.-uTint*.08,1.-uTemp*.12+uTint*.03)*exp2(uExp);
 x=clamp((x-.5)*(1.+uCon)+.5,0.,1.);
 x=uFade+x*(1.-uFade-uRoll);
 float Lm=dot(x,LU);
 x=mix(vec3(Lm)+(x-vec3(Lm))*(1.+uSat),vec3(Lm),uMono);
 x+=uSh/255.*(1.-Lm)*(1.-Lm)+uHi/255.*Lm*Lm;
 }
 if(uVig>0.){vec2 d=v-.5;x*=1.-uVig*pow(dot(d,d)/.5,1.4);}
 if(uGrain>0.){x+=(fract(sin(dot(v*uRes+uSeed,vec2(12.9898,78.233)))*43758.5453)-.5)*uGrain;}
 gl_FragColor=vec4(clamp(mix(o,x,uK)*exp2(uBr),0.,1.),1.);
}`;

function prog(fs){
  const p=gl.createProgram();
  for(const [type,src] of [[gl.VERTEX_SHADER,VS],[gl.FRAGMENT_SHADER,fs]]){
    const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p,s);
  }
  gl.bindAttribLocation(p,0,"a");gl.linkProgram(p);
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const name=gl.getActiveUniform(p,i).name;u[name]=gl.getUniformLocation(p,name);}
  return {p,u};
}
let P;
function tex(){
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  for(const [k,val] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D,k,val);
  return t;
}
function target(w,h){
  const t=tex();gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  return {t,f,w,h};
}
let srcTex,T={},W=0,H=0;
function setup(){
  P={blur:prog(BLUR),copy:prog(COPY),fin:prog(FINAL)};
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  srcTex=tex();
}
function resize(w,h){
  if(w===W&&h===H) return;
  W=w;H=h;canvas.width=w;canvas.height=h;
  for(const k in T){gl.deleteTexture(T[k].t);gl.deleteFramebuffer(T[k].f);}
  const qw=Math.max(1,Math.round(w/4)),qh=Math.max(1,Math.round(h/4));
  T={a:target(w,h),b:target(w,h),q1:target(qw,qh),q2:target(qw,qh)};
}
function pass(pr,inTex,out,dir){
  gl.useProgram(pr.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER,out?out.f:null);
  gl.viewport(0,0,out?out.w:W,out?out.h:H);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,inTex);gl.uniform1i(pr.u.T,0);
  if(dir) gl.uniform2f(pr.u.dir,dir[0],dir[1]);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

// ── 상태 ──
const state={scene:"person",f:"milk",per:{},last:{},facing:"user"};
try{Object.assign(state,JSON.parse(localStorage.getItem("fr-cam")||"{}"));}catch(e){}
if(!SCENES[state.scene]) state.scene="person";
if(!FILTERS.some(f=>f.id===state.f)) state.f="milk";
if(!state.per) state.per={}; if(!state.last) state.last={};
// 조절값은 "장면:필터" 조합마다 따로 기억, 없으면 장면 기본값
// CSSgram 필터는 원본 그대로 보이도록 기본 강도 100
const adj=fid=>state.per[state.scene+":"+fid]||(FILTERS.find(f=>f.id===fid).gram?{...SCENES[state.scene].def,k:100}:SCENES[state.scene].def);
const save=()=>{try{localStorage.setItem("fr-cam",JSON.stringify(state));}catch(e){}};
let holding=false,mode="none",video=null,stream=null,dirty=true;

function render(){
  const s=state, a=adj(s.f);
  // 미리보기 띠가 열려 있으면 인물 필터 썸네일용으로 블러를 항상 계산
  if(a.sm>0||a.wr>0||!$("filterpanel").hidden){
    const big=Math.max(W,H), r1=big/240/4, r2=big/4/70/4;
    pass(P.blur,srcTex,T.a,[r1/W,0]); pass(P.blur,T.a.t,T.b,[0,r1/H]);
    pass(P.copy,srcTex,T.q1);
    const qw=T.q1.w,qh=T.q1.h;
    for(let i=0;i<2;i++){pass(P.blur,T.q1.t,T.q2,[r2/qw,0]);pass(P.blur,T.q2.t,T.q1,[0,r2/qh]);}
  }
  finalPass(s.f,null);
}
// 최종 셰이더 1회: vp가 없으면 화면 전체, 있으면 미리보기 아틀라스의 한 칸에 그림
function finalPass(fid,vp){
  const s=adj(fid), F=FILTERS.find(x=>x.id===fid), p=F.p||{}, sm=s.sm/100, wr=s.wr/100;
  const RW=vp?vp.w:W, RH=vp?vp.h:H;
  const u=P.fin.u;gl.useProgram(P.fin.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER,vp?vp.f:null);
  if(vp) gl.viewport(vp.x,vp.y,vp.w,vp.h); else gl.viewport(0,0,W,H);
  [[srcTex,"S"],[T.b.t,"B"],[T.q1.t,"L"]].forEach(([t,n],i)=>{gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(u[n],i);});
  const f=(n,v)=>gl.uniform1f(u[n],v);
  f("uMirror",mode==="cam"&&state.facing==="user"?1:0); f("uOrig",holding&&!vp?1:0);
  f("uSm",sm); f("uWr",wr); f("uK",s.k/100); f("uBr",s.br/100);
  f("uExp",p.exp||0); f("uCon",p.con||0); f("uSat",p.sat||0); f("uTemp",p.temp||0); f("uTint",p.tint||0);
  f("uFade",p.fade||0); f("uRoll",p.roll||0); f("uVig",p.vig||0); f("uGrain",p.grain||0); f("uMono",p.mono||0); f("uSeed",(performance.now()%1000)/10);
  gl.uniform3fv(u.uSh,p.sh||[0,0,0]); gl.uniform3fv(u.uHi,p.hi||[0,0,0]); gl.uniform2f(u.uRes,RW,RH);
  gl.uniform2f(u.uTx,1/W,1/H); f("uSharp",s.sh/100*1.2);
  f("uG",F.g?1:0);
  if(F.g){
    gl.uniformMatrix3fv(u["uFM[0]"],false,F.g.mat); gl.uniform3fv(u["uFB[0]"],F.g.off);
    F.g.layers.forEach((l,i)=>{
      f("uT"+i,l?l.t:0); if(!l) return;
      f("uM"+i,l.m); f("uN"+i,l.n); f("uOp"+i,l.o);
      // 원형 그라데이션 반지름 = 중심에서 가장 먼 모서리까지 거리(px)
      const cx=l.cen[0]*RW, cy=l.cen[1]*RH;
      f("uFar"+i,Math.max(Math.hypot(cx,cy),Math.hypot(RW-cx,cy),Math.hypot(cx,RH-cy),Math.hypot(RW-cx,RH-cy)));
      gl.uniform2f(u["uCen"+i],l.cen[0],l.cen[1]); gl.uniform3f(u["uP"+i],...l.p);
      l.c.forEach((c,j)=>gl.uniform4f(u["uC"+i+j],...c));
    });
  }
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

function loop(){
  if(mode==="cam"&&video.readyState>=2&&video.videoWidth){
    resize(video.videoWidth,video.videoHeight);
    gl.bindTexture(gl.TEXTURE_2D,srcTex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
    render();
  }else if(mode==="photo"&&dirty){dirty=false;render();}
  if(mode!=="none"){
    fitGrid();
    const now=performance.now();
    if(!$("filterpanel").hidden&&now-lastThumb>700){lastThumb=now;updateThumbs();}
  }
  requestAnimationFrame(loop);
}

// ── 필터 미리보기 썸네일: 37개를 아틀라스 1장에 그린 뒤 한 번에 읽어 각 버튼에 나눠 그림 ──
let atlas=null,lastThumb=0;
const atlasCv=document.createElement("canvas"),atlasCtx=atlasCv.getContext("2d");
function updateThumbs(){
  const btns=[...document.querySelectorAll(".fx")];
  const s=112/Math.max(W,H), tw=Math.max(1,Math.round(W*s)), th=Math.max(1,Math.round(H*s)), cols=8, rows=Math.ceil(btns.length/cols);
  if(!atlas||atlas.tw!==tw||atlas.th!==th||atlas.h!==rows*th){
    if(atlas){gl.deleteTexture(atlas.t);gl.deleteFramebuffer(atlas.f);}
    atlas=Object.assign(target(cols*tw,rows*th),{tw,th,cols});
    atlas.px=new Uint8Array(atlas.w*atlas.h*4);
    atlasCv.width=atlas.w;atlasCv.height=atlas.h;
  }
  btns.forEach((b,i)=>finalPass(b.dataset.id,{f:atlas.f,x:(i%cols)*tw,y:Math.floor(i/cols)*th,w:tw,h:th}));
  gl.readPixels(0,0,atlas.w,atlas.h,gl.RGBA,gl.UNSIGNED_BYTE,atlas.px);
  atlasCtx.putImageData(new ImageData(new Uint8ClampedArray(atlas.px.buffer),atlas.w,atlas.h),0,0);
  // GL은 아래에서 위로 저장되므로 썸네일 캔버스는 CSS로 상하 반전
  btns.forEach((b,i)=>{
    const c=b.firstChild;
    if(c.width!==tw){c.width=tw;c.height=th;}
    c.getContext("2d").drawImage(atlasCv,(i%cols)*tw,Math.floor(i/cols)*th,tw,th,0,0,tw,th);
  });
}

// ── 격자: 화면에 보이는 사진 영역에 맞춰 3×3 ──
let gridKey="";
function fitGrid(){
  const g=$("grid");if(g.hidden) return;
  const sw=stage.clientWidth,sh=stage.clientHeight,key=sw+"x"+sh+"x"+W+"x"+H;
  if(key===gridKey) return; gridKey=key;
  const k=Math.min(sw/W,sh/H),w=W*k,h=H*k;
  Object.assign(g.style,{width:w+"px",height:h+"px",left:(sw-w)/2+"px",top:(sh-h)/2+"px"});
}

// ── 카메라 ──
function showMsg(html,btn){const m=$("msg");m.innerHTML="";const d=document.createElement("div");d.innerHTML=html;
  if(btn){const b=document.createElement("button");b.className="side";b.style.margin="12px auto 0";b.textContent=btn.label;b.onclick=btn.run;d.append(b);}
  m.append(d);m.hidden=false;}
async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:state.facing,width:{ideal:1920},height:{ideal:1440}}});
    if(!video){video=document.createElement("video");video.playsInline=true;video.muted=true;video.setAttribute("playsinline","");}
    video.srcObject=stream;await video.play();
    mode="cam";$("msg").hidden=true;
    // 실제로 받은 카메라 해상도를 조절 패널에 표시 (화질 확인용)
    setTimeout(()=>{$("res").textContent=video.videoWidth?`카메라 ${video.videoWidth}×${video.videoHeight}`:"";},800);
  }catch(e){
    showMsg("카메라를 켤 수 없습니다.<br>설정 → Safari → 카메라에서 허용으로 바꾸거나,<br>아래 앨범 버튼으로 사진을 불러오세요.",{label:"다시 시도",run:startCam});
    if(mode!=="photo") loadSample();
  }
}
$("flip").onclick=()=>{state.facing=state.facing==="user"?"environment":"user";save();startCam();};

// 사진 불러오기 (앨범) — 최대 4096px
function useImage(img){
  const s=Math.min(1,4096/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  mode="photo";resize(c.width,c.height);
  gl.bindTexture(gl.TEXTURE_2D,srcTex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
  dirty=true;
}
$("lib").onchange=async e=>{
  const file=e.target.files[0];e.target.value="";if(!file) return;
  try{const url=URL.createObjectURL(file),img=new Image();img.src=url;await img.decode();useImage(img);URL.revokeObjectURL(url);
    showMsg("앨범 사진 편집 중",{label:"카메라로 돌아가기",run:startCam});setTimeout(()=>$("msg").hidden=true,1200);}
  catch(err){showMsg("이 사진을 열 수 없습니다. 다른 사진을 골라주세요.");}
};
// 카메라를 못 쓸 때 보여줄 예시 그림
function loadSample(){
  const c=document.createElement("canvas");c.width=900;c.height=1200;const g=c.getContext("2d");
  let gr=g.createLinearGradient(0,0,0,1200);gr.addColorStop(0,"#b9c7d6");gr.addColorStop(1,"#e7d9cf");g.fillStyle=gr;g.fillRect(0,0,900,1200);
  g.fillStyle="#41536b";g.beginPath();g.moveTo(170,1200);g.quadraticCurveTo(450,820,730,1200);g.fill();
  g.fillStyle="#d9ab92";g.fillRect(395,780,110,180);
  g.fillStyle="#2b2220";g.beginPath();g.ellipse(450,500,250,300,0,0,7);g.fill();
  gr=g.createRadialGradient(420,520,40,450,560,260);gr.addColorStop(0,"#efc6ad");gr.addColorStop(1,"#c9937a");
  g.fillStyle=gr;g.beginPath();g.ellipse(450,560,190,245,0,0,7);g.fill();
  g.fillStyle="#2b2220";g.beginPath();g.ellipse(450,380,215,120,0,Math.PI,0);g.fill();
  g.fillStyle="#3a2a26";for(const x of [380,520]){g.beginPath();g.ellipse(x,560,20,11,0,0,7);g.fill();}
  g.fillStyle="#c9756f";g.beginPath();g.ellipse(450,690,46,16,0,0,7);g.fill();
  useImage(c);
}

// ── 촬영과 저장 ──
let shotBlob=null,shotExt="jpg",shotUrl="",shootMode="photo",rec=null,recTimer=0,mic=null;
function showReview(blob,ext){
  shotBlob=blob;shotExt=ext;shotUrl=URL.createObjectURL(blob);
  const isVid=ext!=="jpg";
  $("shot").hidden=isVid;$("clip").hidden=!isVid;
  if(isVid){$("clip").src=shotUrl;$("clip").play().catch(()=>{});}else $("shot").src=shotUrl;
  $("save").textContent=isVid?"동영상 저장":"사진 저장";
  $("review").hidden=false;
}
function setShootMode(m){
  shootMode=m;
  document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));
  $("shutter").classList.toggle("video",m==="video");
  // 동영상 모드로 바꿀 때 마이크 권한을 미리 받음 (거부하면 소리 없이 녹화)
  if(m==="video"&&mic===null){
    mic=false;
    navigator.mediaDevices.getUserMedia({audio:true}).then(a=>{mic=a.getAudioTracks()[0];}).catch(()=>{});
  }
}
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{if(!rec) setShootMode(b.dataset.m);});

function startRec(){
  if(!canvas.captureStream||!window.MediaRecorder){showMsg("이 기기에서는 동영상 녹화를 지원하지 않습니다.<br>iOS를 최신 버전으로 업데이트해 주세요.",{label:"닫기",run:()=>$("msg").hidden=true});return;}
  const cs=canvas.captureStream(30);
  if(mic) cs.addTrack(mic);
  const type=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"].find(t=>MediaRecorder.isTypeSupported(t))||"";
  const chunks=[];
  rec=new MediaRecorder(cs,type?{mimeType:type,videoBitsPerSecond:8e6}:{});
  rec.ondataavailable=e=>{if(e.data.size) chunks.push(e.data);};
  rec.onstop=()=>{
    const mt=rec.mimeType||type||"video/mp4";
    showReview(new Blob(chunks,{type:mt}),mt.includes("webm")?"webm":"mp4");
    rec=null;
  };
  rec.start(1000);
  const t0=Date.now(),lab=$("rectime");lab.hidden=false;
  recTimer=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);lab.textContent=`● ${String(s/60|0).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;},250);
  lab.textContent="● 00:00";
  $("shutter").classList.add("rec");
}
function stopRec(){
  clearInterval(recTimer);$("rectime").hidden=true;$("shutter").classList.remove("rec");
  rec.stop();
}

$("shutter").onclick=()=>{
  if(mode==="none") return;
  if(shootMode==="video"){
    if(mode!=="cam"){showMsg("동영상은 카메라 화면에서만 찍을 수 있습니다.",{label:"카메라로 돌아가기",run:startCam});return;}
    rec?stopRec():startRec();return;
  }
  render();
  const fl=$("flash");fl.style.transition="none";fl.style.opacity=".8";requestAnimationFrame(()=>{fl.style.transition="opacity .25s";fl.style.opacity="0";});
  // 빠른 저장: 터치 직후(동기)에 공유 시트를 바로 띄워야 iOS가 허용하므로 toDataURL로 즉시 변환
  const d=atob(canvas.toDataURL("image/jpeg",.93).split(",")[1]), u8=new Uint8Array(d.length);
  for(let i=0;i<d.length;i++) u8[i]=d.charCodeAt(i);
  const blob=new Blob([u8],{type:"image/jpeg"}), file=new File([blob],fileName("jpg"),{type:"image/jpeg"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    // 공유 시트를 닫으면 저장 안 함, 다른 오류면 확인 화면으로
    navigator.share({files:[file]}).catch(e=>{if(e.name!=="AbortError") showReview(blob,"jpg");});
  }else showReview(blob,"jpg");
};
const fileName=ext=>"filterroom_"+new Date().toISOString().slice(0,19).replace(/[-:T]/g,"")+"."+ext;
$("retake").onclick=()=>{$("review").hidden=true;$("clip").pause();URL.revokeObjectURL(shotUrl);};
$("save").onclick=async()=>{
  const name=fileName(shotExt);
  const file=new File([shotBlob],name,{type:shotBlob.type||(shotExt==="jpg"?"image/jpeg":"video/mp4")});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});}catch(e){}
  }else{
    const a=document.createElement("a");a.href=shotUrl;a.download=name;a.click();
  }
};

// ── 필터 띠와 슬라이더 ──
const strip=$("strip"), SL=["k","wr","sm","sh","br"];
// 슬라이더를 현재 필터의 값으로 맞춤
function syncSliders(){const a=adj(state.f);for(const id of SL){$(id).value=a[id];$(id+"v").textContent=a[id];}}
// 필터 띠: 현재 장면의 추천 필터 → "그 밖의 필터" 순서로 다시 만듦
function buildStrip(){
  strip.textContent="";
  const rec=SCENES[state.scene].rec, rest=FILTERS.filter(f=>!rec.includes(f.id)).map(f=>f.id);
  const addSep=t=>{const sp=document.createElement("span");sp.className="sep";sp.textContent=t;strip.append(sp);};
  addSep(SCENES[state.scene].label+" 추천");
  [...rec,...rest].forEach((id,i)=>{
    if(i===rec.length) addSep("그 밖의 필터");
    const f=FILTERS.find(x=>x.id===id);
    const b=document.createElement("button");b.className="fx";b.type="button";b.dataset.id=id;
    const cv=document.createElement("canvas"),nm=document.createElement("span");nm.textContent=f.name;b.append(cv,nm);
    b.setAttribute("aria-pressed",id===state.f);
    b.onclick=()=>pickFilter(id);
    strip.append(b);
  });
  lastThumb=0;
}
function pickFilter(id){
  state.f=id;state.last[state.scene]=id;save();
  strip.querySelectorAll(".fx").forEach(x=>x.setAttribute("aria-pressed",x.dataset.id===id));
  syncSliders();showName();dirty=true;
}
// 장면 바꾸기: 그 장면에서 마지막에 쓴 필터, 없으면 첫 추천 필터로
function pickScene(sc){
  state.scene=sc;
  document.querySelectorAll("#scenes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===sc));
  $("scenehint").textContent=sc==="person"?"인물 보정 켜짐 · 값은 필터마다 기억":"인물 보정 꺼짐 · 값은 필터마다 기억";
  buildStrip();pickFilter(state.last[sc]||SCENES[sc].rec[0]);
}
for(const [k,s] of Object.entries(SCENES)){
  const b=document.createElement("button");b.type="button";b.dataset.s=k;b.textContent=s.label;
  b.onclick=()=>pickScene(k);$("scenes").append(b);
}
for(const id of SL){
  $(id).oninput=()=>{
    state.per[state.scene+":"+state.f]={...adj(state.f),[id]:+$(id).value};
    $(id+"v").textContent=$(id).value;save();dirty=true;
  };
}
// 현재 장면·필터 값을 기본값으로 되돌리기
$("reset").onclick=()=>{delete state.per[state.scene+":"+state.f];save();syncSliders();dirty=true;};
// 필터·조절 패널 열고 닫기 (각각 따로, 둘 다 열어 두고 화면을 보며 조정 가능)
function togglePanel(id){
  const open=$(id).hidden;
  $(id).hidden=!open;$(id==="filterpanel"?"t-strip":"t-"+id).setAttribute("aria-expanded",open);
  if(id==="filterpanel"&&open) lastThumb=0; // 열자마자 썸네일 갱신
}
$("t-strip").onclick=()=>togglePanel("filterpanel");
$("t-controls").onclick=()=>togglePanel("controls");
function showName(){$("curname").textContent=SCENES[state.scene].label+" · "+FILTERS.find(f=>f.id===state.f).name;}
{const f=state.f;pickScene(state.scene);if(state.last[state.scene]!==f&&FILTERS.some(x=>x.id===f)) pickFilter(f);}
// 미리보기를 누르고 있는 동안 원본 보기 (패널은 열린 채 유지)
const stage=$("stage");
stage.addEventListener("pointerdown",e=>{if(e.target.closest(".panel,#t-grid")) return;holding=true;dirty=true;});
// 격자 켜고 끄기 (화면에만 보이고 사진·동영상에는 찍히지 않음)
function setGrid(on){state.grid=on;save();$("grid").hidden=!on;$("t-grid").setAttribute("aria-pressed",on);gridKey="";}
$("t-grid").onclick=()=>setGrid(!state.grid);
setGrid(!!state.grid);
for(const ev of ["pointerup","pointercancel","pointerleave"]) stage.addEventListener(ev,()=>{holding=false;dirty=true;});

// ── 시작 ──
if(!gl){showMsg("이 기기에서는 그래픽 가속(WebGL)을 쓸 수 없습니다.");}
else{
  try{setup();resize(4,4);requestAnimationFrame(loop);
    if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia) startCam(); else {loadSample();showMsg("이 브라우저는 카메라를 지원하지 않습니다. 앨범 버튼으로 사진을 불러오세요.");}
  }catch(e){showMsg("초기화 오류: "+e.message);}
}
</script>
